name: Thorpe CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/generate-icons.sh
      - run: npm run lint
      - run: bash scripts/check-versions.sh
      - run: npm run build
      - run: npm run test
      - run: npm run test:e2e

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - run: npm ci
      - run: bash scripts/generate-icons.sh
      - run: npm run build
      - run: cd src-tauri && cargo check
      - run: cd src-tauri && cargo test
      - run: cd src-tauri && cargo build --release
      - name: License server smoke tests
        run: cd tools/license-server && python3 test_server.py
