services:
  license-server:
    build: .
    ports:
      - "8787:8787"
    environment:
      THORPE_LICENSE_SIGNING_SECRET: ${THORPE_LICENSE_SIGNING_SECRET:-change-me-in-production}
      THORPE_LICENSE_API_TOKEN: ${THORPE_LICENSE_API_TOKEN:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PROFESSIONAL: ${STRIPE_PRICE_PROFESSIONAL:-}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
      THORPE_CHECKOUT_SUCCESS_URL: ${THORPE_CHECKOUT_SUCCESS_URL:-https://thorpe.app/licensing?checkout=success&session_id={CHECKOUT_SESSION_ID}}
      THORPE_CHECKOUT_CANCEL_URL: ${THORPE_CHECKOUT_CANCEL_URL:-https://thorpe.app/licensing?checkout=cancel}
    volumes:
      - license-data:/data

volumes:
  license-data:
