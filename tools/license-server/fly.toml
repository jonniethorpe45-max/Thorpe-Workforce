# Fly.io deployment for Thorpe license + billing server
# Usage: fly launch --no-deploy && fly secrets set THORPE_LICENSE_SIGNING_SECRET=... && fly deploy

app = "thorpe-license-server"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  THORPE_LICENSE_SERVER_HOST = "0.0.0.0"
  THORPE_LICENSE_SERVER_PORT = "8787"
  THORPE_LICENSE_SESSION_STORE = "/data/checkout_sessions.json"
  THORPE_LICENSE_RATE_LIMIT = "120"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 100

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "license_data"
  destination = "/data"
